[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-review-master"
version = "0.1.0"
description = ""
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "", email = "768616253@qq.com" }]
requires-python = ">=3.12"
dependencies = [
  "edge-tts==7.2.8",
  "ffmpeg-python==0.2.0",
  "faster-whisper==1.2.1",
  "moviepy==2.2.1",
  "qwen-tts==0.1.1",
  "torch==2.7.0",
  "torchaudio==2.7.0",
  "yt-dlp==2026.3.17",
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
generate-subtitles = "app.pipeline.stage_0_generate_subtitles:main"
index-visuals = "app.pipeline.stage_1_index_visuals:main"
parse-subtitles = "app.pipeline.stage_1_parse_subtitles:main"
build-prompt = "app.pipeline.stage_2_build_prompt:main"
generate-script-audio = "app.pipeline.stage_3_generate_audio:main"
prepare-voice-reference = "app.tools.prepare_voice_reference:main"
transcribe = "app.tools.transcribe_audio:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests/pipeline", "tests/tools", "tests/workbench"]
pythonpath = ["."]
