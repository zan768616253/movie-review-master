# Template for the active movie. Copy to current_movie.toml and fill in.
# Paths are relative to the repo root.

[common]
movie_slug    = "TODO_short_slug_no_spaces"      # used as workbench/work/<slug>/
movie_dir     = "movies/TODO_movie_folder_name"
movie_title   = "TODO Display Title"
video_file    = "TODO.mkv"
subtitle_file = "TODO.srt"
style_path    = "styles/niu-shu.md"
genre         = "action"

# Stage 2 digest mode:
#   "single"  (default) — one LLM call for Pass 1
#   "chunked" — three LLM calls (front/climax/tail) for very long movies
digest_mode   = "single"

# Soft hint for prompt builders.
target_seconds = 720.0

# Optional per-movie overrides. TTS sampling defaults live with the style
# at styles/voice-assets/<style>/voice_clone.toml. Set values here only for
# one-off per-movie tuning. CLI overrides > this file > style toml > defaults.

# [tools.generate_script_audio]
# temperature = 0.65

