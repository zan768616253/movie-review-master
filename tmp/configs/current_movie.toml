# Pipeline config for "杀破狼2".
# Paths are relative to the repo root.

[common]
movie_slug    = "sha_po_lang_2"
movie_dir     = "movies/杀破狼2"
movie_title   = "杀破狼2 (SPL II: A Time for Consequences)"
video_file    = "杀破狼2.mkv"
subtitle_file = "杀破狼2.ass"
style_path    = "styles/niu-shu.md"
genre         = "Action"

# Target final-review length in seconds.
target_seconds = 720.0

# Optional tool harness settings used by tmp/tools/*.py.
# Most tool paths are derived automatically from [common]. Uncomment only the
# overrides you actually need.

[tools.build_story_prompt]
out = "tmp/work/sha_po_lang_2/tools/story_prompt.txt"

# Voice-clone TTS sampling settings live with the style in
# styles/voice-assets/<style>/voice_clone.toml so all movies that use the same
# style get the same voice. Override here only for one-off per-movie tuning.

