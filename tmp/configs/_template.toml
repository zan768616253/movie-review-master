# Template for the active movie. Copy this file to current_movie.toml and fill in.
# Paths are relative to the repo root.

[common]
movie_slug    = "TODO_short_slug_no_spaces"      # used as the work folder name under tmp/work/
movie_dir     = "movies/TODO_movie_folder_name"
movie_title   = "TODO Display Title"
video_file    = "TODO.mkv"
subtitle_file = "TODO.srt"
style_path    = "styles/niu-shu.md"
genre         = "action"                          # action / drama / etc

# Target final-review length in seconds. The new video-driven pipeline
# uses this as a soft hint for how much rough cut to assemble.
target_seconds = 300.0

# Optional tool harness settings used by tmp/tools/*.py.
